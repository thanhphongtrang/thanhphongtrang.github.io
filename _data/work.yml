# Tools & industry work.
#
# `instrument` leads the page. It is the research instrument, not industry work,
# and it is what makes the researcher/builder claim concrete.
# `applied` is the Volvo-era AI product work: AI assisting human decisions.
# `recent` is recent applied AI work, deliberately light-touch. See below.

instrument:
  title: "A trace-capturing co-creation environment"
  status: "In development"
  summary: >-
    The research instrument for my doctorate: a web environment where a teacher
    educator and a generative AI model co-create teaching material while every move
    either party makes is recorded. Prompts, suggestions, accepts, rejects, edits,
    reversions, pauses.
  detail: >-
    Most studies of AI in professional work ask people afterwards what happened.
    Self-report is exactly where judgment goes invisible; you do not remember the
    suggestion you waved through. Capturing the interaction itself lets me see
    where a professional overrode the model, where they went along with it, and
    what they made of what came back, rather than what they later recall doing.
  stack: "TypeScript · Vite · trace logging · TPACK-informed task design"
  note: >-
    Built under a research-software discipline: reproducible, accessible, and with
    the empirical data boundary enforced in code rather than in good intentions.
  repo_url: "https://github.com/thanhphongtrang/graite-instrument"
  screenshot: true # placeholder slot until Phong supplies a real capture

