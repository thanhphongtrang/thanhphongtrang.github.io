# Publications.
#
# `authors` is the author string AS PUBLISHED. Deliberate: you cite what is
# printed on the paper, even where it disagrees with your canonical name.
# Wrap your own name in **double asterisks** and the template bolds it.
#
# Verified 2026-07-16 against the AIS eLibrary and GUPEA's OAI record.
# Do not edit venue strings from memory; check the source.

peer_reviewed:
  - title: "Three Faces of Analytics: How Big Data Enables Operative Decisions, Drives Transformative Change, and Builds Adaptive Capability"
    authors: "**Trang, P.**, Chowdhury, S., Chaudhary, I., & Kaluarachchilage, K. R. R."
    year: 2026
    venue: "ECIS 2026 Proceedings 18, European Conference on Information Systems, Milan"
    note: >-
      First author. Systematic literature review synthesising 62 peer-reviewed
      studies (2020–2025) on how descriptive, predictive and prescriptive analytics
      mediate organisational decision-making. Literature Review track.
    links:
      - text: "Paper (AIS eLibrary)"
        url: "https://aisel.aisnet.org/ecis2026/litrev/litrev/18"
      - text: "Google Scholar"
        url: "https://scholar.google.com/citations?user=nRgdLFoAAAAJ"

# Not peer-reviewed, and labelled so on purpose: a master's thesis dressed up as
# a conference paper is exactly what a reviewer notices, and it costs more
# credibility than the line is worth.
other:
