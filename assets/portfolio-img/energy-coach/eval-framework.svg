<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="efT efD" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="efT">Evaluation method for the GenAI energy coach</title>
<desc id="efD">Four fixed household personas and a golden set of about one hundred real questions feed a scoring step that rates every answer as grounded or not, safe to risky, and flags criticals. A separate adversarial lane probes guardrails. The output is an accuracy baseline and a ranked, severity-tiered fix list, reusable every round.</desc>
<style>
.bg{fill:#fafbf9}
.card{fill:#ffffff;stroke:#e1e6e0;stroke-width:1}
.accentfill{fill:#e7f1ea;stroke:#146840;stroke-width:1.5}
.out{fill:#ffffff;stroke:#146840;stroke-width:1.5}
.title{fill:#1b1d1b;font-family:Georgia,serif}
.t{fill:#1b1d1b}
.muted{fill:#545b54}
.accent{fill:#146840;font-weight:600}
.col{fill:#545b54;letter-spacing:1.5px}
.arrow{stroke:#545b54;stroke-width:1.5;fill:none}
.ah{fill:#545b54}
@media (prefers-color-scheme:dark){
.bg{fill:#171a18}
.card{fill:#1f241f;stroke:#303830}
.accentfill{fill:#1f2b22;stroke:#7fcf9f}
.out{fill:#1f241f;stroke:#7fcf9f}
.title,.t{fill:#e9ece8}
.muted,.col{fill:#a6aea5}
.accent{fill:#7fcf9f}
.arrow{stroke:#a6aea5}
.ah{fill:#a6aea5}
}
</style>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path class="ah" d="M0,0 L9,4.5 L0,9 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="820" height="470" rx="10"/>
<text class="title" x="24" y="38" font-size="21">Validating the coach before pilot</text>
<text class="muted" x="24" y="60" font-size="13">A repeatable evaluation, run on internal data in days, not weeks.</text>

<text class="col" x="24" y="96" font-size="11">INPUTS</text>
<text class="col" x="312" y="96" font-size="11">SCORE EVERY ANSWER</text>
<text class="col" x="590" y="96" font-size="11">OUTPUT</text>

<rect class="card" x="24" y="108" width="240" height="150" rx="8"/>
<text class="accent" x="40" y="132" font-size="14">4 fixed personas</text>
<text class="muted" x="40" y="156" font-size="12.5">Heat-pump villa</text>
<text class="muted" x="40" y="178" font-size="12.5">EV household</text>
<text class="muted" x="40" y="200" font-size="12.5">District-heating apartment</text>
<text class="muted" x="40" y="222" font-size="12.5">Solar villa</text>
<text class="muted" x="40" y="247" font-size="11">precise profiles, comparable across testers</text>

<rect class="card" x="24" y="272" width="240" height="88" rx="8"/>
<text class="accent" x="40" y="296" font-size="14">Golden set</text>
<text class="muted" x="40" y="318" font-size="12.5">~100 real questions: bill, pricing, fees</text>
<text class="muted" x="40" y="340" font-size="11">graded vs ground truth</text>

<rect class="accentfill" x="312" y="108" width="230" height="176" rx="8"/>
<text class="accent" x="330" y="134" font-size="14">Score every answer</text>
<text class="t" x="330" y="164" font-size="12.5">Grounded?   yes / no</text>
<text class="t" x="330" y="190" font-size="12.5">Safe   &#8594;   risky</text>
<text class="t" x="330" y="216" font-size="12.5">Critical flag</text>
<text class="muted" x="330" y="252" font-size="11">separates &#8220;slightly off&#8221;</text>
<text class="muted" x="330" y="268" font-size="11">from &#8220;dangerous&#8221;</text>

<rect class="card" x="312" y="300" width="230" height="88" rx="8"/>
<text class="accent" x="330" y="324" font-size="14">Adversarial lane</text>
<text class="muted" x="330" y="346" font-size="12.5">malicious &amp; out-of-scope</text>
<text class="muted" x="330" y="364" font-size="12.5">questions</text>

<rect class="out" x="590" y="132" width="206" height="118" rx="8"/>
<text class="accent" x="606" y="158" font-size="14">Accuracy baseline</text>
<text class="t" x="606" y="180" font-size="13">+ ranked fix list</text>
<text class="muted" x="606" y="204" font-size="11">severity-tiered,</text>
<text class="muted" x="606" y="219" font-size="11">reusable every round</text>

<rect class="card" x="590" y="300" width="206" height="88" rx="8"/>
<text class="accent" x="606" y="324" font-size="14">Guardrail hardening</text>
<text class="muted" x="606" y="346" font-size="12.5">close gaps before</text>
<text class="muted" x="606" y="364" font-size="12.5">real users</text>

<line class="arrow" x1="264" y1="176" x2="306" y2="158" marker-end="url(#ah)"/>
<line class="arrow" x1="264" y1="312" x2="306" y2="226" marker-end="url(#ah)"/>
<line class="arrow" x1="542" y1="190" x2="584" y2="188" marker-end="url(#ah)"/>
<line class="arrow" x1="542" y1="344" x2="584" y2="344" marker-end="url(#ah)"/>
</svg>
