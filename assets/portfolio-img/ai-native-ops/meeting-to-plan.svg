<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="mpT mpD" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="mpT">From customer meeting to plan</title>
<desc id="mpD">A customer meeting is transcribed into HubSpot. Claude drafts requirements, then Jira tasks and a Confluence change. A person approves the high-stakes items before work is assigned and Confluence is updated, so the single source of truth stays current. Built in service delivery, then adopted by sales.</desc>
<style>
.bg{fill:#fafbf9}
.card{fill:#ffffff;stroke:#e1e6e0;stroke-width:1}
.accentfill{fill:#e7f1ea;stroke:#146840;stroke-width:1.5}
.out{fill:#ffffff;stroke:#146840;stroke-width:1.5}
.chip{fill:#f1f4f0;stroke:#e1e6e0;stroke-width:1}
.warnfill{fill:#fbf0e2;stroke:#8a4b0f;stroke-width:1}
.title{fill:#1b1d1b;font-family:Georgia,serif}
.big{fill:#1b1d1b;font-family:Georgia,serif}
.t{fill:#1b1d1b}
.muted{fill:#545b54}
.accent{fill:#146840;font-weight:600}
.warn{fill:#8a4b0f;font-weight:600}
.col{fill:#545b54;letter-spacing:1.5px}
.arrow{stroke:#545b54;stroke-width:1.5;fill:none}
.accentarrow{stroke:#146840;stroke-width:1.5;fill:none}
.dash{stroke:#545b54;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
.silo{stroke:#c9d1c8;stroke-width:1;fill:none;stroke-dasharray:3 5}
.ah{fill:#545b54}
.aha{fill:#146840}
.divider{stroke:#e1e6e0;stroke-width:1}
@media (prefers-color-scheme:dark){
.bg{fill:#171a18}
.card{fill:#1f241f;stroke:#303830}
.accentfill{fill:#1f2b22;stroke:#7fcf9f}
.out{fill:#1f241f;stroke:#7fcf9f}
.chip{fill:#171a18;stroke:#303830}
.warnfill{fill:#2e2416;stroke:#f0b878}
.title,.big,.t{fill:#e9ece8}
.muted,.col{fill:#a6aea5}
.accent{fill:#7fcf9f}
.warn{fill:#f0b878}
.arrow,.dash{stroke:#a6aea5}
.accentarrow{stroke:#7fcf9f}
.silo{stroke:#3d463d}
.ah{fill:#a6aea5}
.aha{fill:#7fcf9f}
.divider{stroke:#303830}
}
</style>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path class="ah" d="M0,0 L9,4.5 L0,9 z"/></marker><marker id="aha" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path class="aha" d="M0,0 L9,4.5 L0,9 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="900" height="330" rx="10"/>
<text class="title" x="24" y="38" font-size="21">From customer meeting to plan</text><text class="muted" x="24" y="60" font-size="13">Built in service delivery, then adopted by sales.</text><rect class="card" x="24" y="128" width="122" height="56" rx="6"/><text class="t" x="85.0" y="152.3" font-size="12" text-anchor="middle">Customer</text><text class="muted" x="85.0" y="168.3" font-size="11" text-anchor="middle">meeting</text><rect class="card" x="170" y="128" width="122" height="56" rx="6"/><text class="t" x="231.0" y="152.3" font-size="12" text-anchor="middle">Transcript</text><text class="muted" x="231.0" y="168.3" font-size="11" text-anchor="middle">into HubSpot</text><rect class="card" x="316" y="128" width="122" height="56" rx="6"/><text class="t" x="377.0" y="152.3" font-size="12" text-anchor="middle">Requirements</text><text class="muted" x="377.0" y="168.3" font-size="11" text-anchor="middle">drafted by Claude</text><rect class="card" x="462" y="90" width="122" height="50" rx="6"/><text class="t" x="523.0" y="111.3" font-size="12" text-anchor="middle">Jira tasks</text><text class="muted" x="523.0" y="127.3" font-size="11" text-anchor="middle">drafted</text><rect class="card" x="462" y="172" width="122" height="50" rx="6"/><text class="t" x="523.0" y="193.3" font-size="12" text-anchor="middle">Confluence</text><text class="muted" x="523.0" y="209.3" font-size="11" text-anchor="middle">change drafted</text><rect class="accentfill" x="608" y="120" width="122" height="72" rx="8"/><text class="accent" x="669.0" y="144.3" font-size="12" text-anchor="middle">A person</text><text class="muted" x="669.0" y="160.3" font-size="11" text-anchor="middle">approves the</text><text class="muted" x="669.0" y="176.3" font-size="11" text-anchor="middle">high-stakes items</text><rect class="out" x="754" y="120" width="122" height="72" rx="6"/><text class="t" x="815.0" y="144.3" font-size="12" text-anchor="middle">Work assigned,</text><text class="muted" x="815.0" y="160.3" font-size="11" text-anchor="middle">Confluence</text><text class="muted" x="815.0" y="176.3" font-size="11" text-anchor="middle">stays current</text><path class="arrow" d="M146 156 H166" marker-end="url(#ah)"/><path class="arrow" d="M292 156 H312" marker-end="url(#ah)"/><path class="arrow" d="M438 156 H448 V115 H458" marker-end="url(#ah)"/><path class="arrow" d="M438 156 H448 V197 H458" marker-end="url(#ah)"/><path class="arrow" d="M584 115 H594 V150 H604" marker-end="url(#ah)"/><path class="arrow" d="M584 197 H594 V162 H604" marker-end="url(#ah)"/><path class="arrow" d="M730 156 H750" marker-end="url(#ah)"/><text class="col" x="24" y="262" font-size="11">WHY THE GATE MATTERS</text><text class="t" x="24" y="284" font-size="13">Confluence is the single source of truth. Claude drafts every change, but nothing high-stakes lands there</text><text class="t" x="24" y="302" font-size="13">until a person has approved it, so ten years of pages stop getting messier.</text></svg>
