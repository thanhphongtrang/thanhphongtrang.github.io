<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="dbT dbD" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="dbT">Pilot readout</title>
<desc id="dbD">Four headline figures: 20% fewer meeting minutes, from before-and-after comparison; two hires not needed, a sales assistant and a Ruby developer, from the hiring plan; 10,000 SEK a month AI cost, from the invoice; two teams on one shared workflow, counted. How it spread: built with engineering managers and two super users, proved in service delivery, adopted by sales, supported by regular lunch sessions with Claude. What staff said: they find the right page in ten years of badly structured Confluence, no longer need a meeting to learn what was said the year before, and worry about running out of tokens before the monthly limit resets.</desc>
<style>
.bg{fill:#fafbf9}
.card{fill:#ffffff;stroke:#e1e6e0;stroke-width:1}
.accentfill{fill:#e7f1ea;stroke:#146840;stroke-width:1.5}
.out{fill:#ffffff;stroke:#146840;stroke-width:1.5}
.chip{fill:#f1f4f0;stroke:#e1e6e0;stroke-width:1}
.warnfill{fill:#fbf0e2;stroke:#8a4b0f;stroke-width:1}
.title{fill:#1b1d1b;font-family:Georgia,serif}
.big{fill:#1b1d1b;font-family:Georgia,serif}
.t{fill:#1b1d1b}
.muted{fill:#545b54}
.accent{fill:#146840;font-weight:600}
.warn{fill:#8a4b0f;font-weight:600}
.col{fill:#545b54;letter-spacing:1.5px}
.arrow{stroke:#545b54;stroke-width:1.5;fill:none}
.accentarrow{stroke:#146840;stroke-width:1.5;fill:none}
.dash{stroke:#545b54;stroke-width:1.2;fill:none;stroke-dasharray:4 4}
.silo{stroke:#c9d1c8;stroke-width:1;fill:none;stroke-dasharray:3 5}
.ah{fill:#545b54}
.aha{fill:#146840}
.divider{stroke:#e1e6e0;stroke-width:1}
@media (prefers-color-scheme:dark){
.bg{fill:#171a18}
.card{fill:#1f241f;stroke:#303830}
.accentfill{fill:#1f2b22;stroke:#7fcf9f}
.out{fill:#1f241f;stroke:#7fcf9f}
.chip{fill:#171a18;stroke:#303830}
.warnfill{fill:#2e2416;stroke:#f0b878}
.title,.big,.t{fill:#e9ece8}
.muted,.col{fill:#a6aea5}
.accent{fill:#7fcf9f}
.warn{fill:#f0b878}
.arrow,.dash{stroke:#a6aea5}
.accentarrow{stroke:#7fcf9f}
.silo{stroke:#3d463d}
.ah{fill:#a6aea5}
.aha{fill:#7fcf9f}
.divider{stroke:#303830}
}
</style>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path class="ah" d="M0,0 L9,4.5 L0,9 z"/></marker><marker id="aha" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path class="aha" d="M0,0 L9,4.5 L0,9 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="900" height="510" rx="10"/>
<text class="title" x="24" y="38" font-size="21">Pilot readout</text><text class="muted" x="24" y="60" font-size="13">A 50-person software company, three countries. Each figure shows where it came from.</text><rect class="card" x="24.0" y="84" width="201.0" height="112" rx="8"/><text class="big" x="42.0" y="132" font-size="32">−20%</text><text class="t" x="42.0" y="156" font-size="13">meeting minutes</text><rect class="chip" x="42.0" y="168" width="123.6" height="18" rx="9"/><text class="muted" x="103.8" y="181" font-size="10.5" text-anchor="middle">Before and after</text><rect class="card" x="241.0" y="84" width="201.0" height="112" rx="8"/><text class="big" x="259.0" y="132" font-size="32">2</text><text class="t" x="259.0" y="156" font-size="13">hires not needed</text><rect class="chip" x="259.0" y="168" width="90.6" height="18" rx="9"/><text class="muted" x="304.3" y="181" font-size="10.5" text-anchor="middle">Hiring plan</text><rect class="card" x="458.0" y="84" width="201.0" height="112" rx="8"/><text class="big" x="476.0" y="132" font-size="32">10k SEK</text><text class="t" x="476.0" y="156" font-size="13">AI cost per month</text><rect class="chip" x="476.0" y="168" width="64.2" height="18" rx="9"/><text class="muted" x="508.1" y="181" font-size="10.5" text-anchor="middle">Invoice</text><rect class="card" x="675.0" y="84" width="201.0" height="112" rx="8"/><text class="big" x="693.0" y="132" font-size="32">2 teams</text><text class="t" x="693.0" y="156" font-size="13">on one shared workflow</text><rect class="chip" x="693.0" y="168" width="64.2" height="18" rx="9"/><text class="muted" x="725.1" y="181" font-size="10.5" text-anchor="middle">Counted</text><text class="muted" x="24" y="218" font-size="11.5">The two hires: a sales assistant and a Ruby developer. The workflows now cover the work in between.</text><rect class="card" x="24" y="236" width="410" height="250" rx="8"/><text class="col" x="44" y="264" font-size="11">HOW IT SPREAD</text><circle class="ah" cx="52" cy="296" r="6"/><line class="silo" x1="52" y1="304" x2="52" y2="344"/><text class="accent" x="70" y="300" font-size="13">Built</text><text class="muted" x="70" y="318" font-size="12">with engineering managers and two super users</text><circle class="ah" cx="52" cy="352" r="6"/><line class="silo" x1="52" y1="360" x2="52" y2="400"/><text class="accent" x="70" y="356" font-size="13">Proved</text><text class="muted" x="70" y="374" font-size="12">in service delivery, on real customer meetings</text><circle class="aha" cx="52" cy="408" r="6"/><text class="accent" x="70" y="412" font-size="13">Adopted</text><text class="muted" x="70" y="430" font-size="12">by sales for their own customer meetings</text><text class="muted" x="44" y="470" font-size="12">Supported by regular lunch sessions with Claude.</text><rect class="card" x="450" y="236" width="426" height="250" rx="8"/><text class="col" x="470" y="264" font-size="11">WHAT STAFF SAID</text><rect class="accentfill" x="470" y="285" width="22" height="22" rx="11"/><text class="accent" x="481" y="301" font-size="13" text-anchor="middle">+</text><text class="t" x="506" y="300" font-size="13">Finds the right page in ten years</text><text class="muted" x="506" y="318" font-size="12.5">of badly structured Confluence</text><rect class="accentfill" x="470" y="345" width="22" height="22" rx="11"/><text class="accent" x="481" y="361" font-size="13" text-anchor="middle">+</text><text class="t" x="506" y="360" font-size="13">No meeting needed to learn what was</text><text class="muted" x="506" y="378" font-size="12.5">said and noted the year before</text><rect class="warnfill" x="470" y="405" width="22" height="22" rx="11"/><text class="warn" x="481" y="421" font-size="13" text-anchor="middle">!</text><text class="t" x="506" y="420" font-size="13">Worry about running out of tokens</text><text class="muted" x="506" y="438" font-size="12.5">before the monthly limit resets</text><text class="muted" x="470" y="470" font-size="12">Paraphrased from interviews with staff and leaders.</text></svg>
