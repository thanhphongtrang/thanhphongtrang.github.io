<footer class="site-foot">
  <div class="wrap">
    <ul class="foot-links">
      {%- for l in site.data.links -%}
        {%- if l.url -%}
          <li><a href="{{ l.url }}"{% unless l.url contains "mailto" %} rel="me"{% endunless %}>{{ l.label }}</a></li>
        {%- endif -%}
      {%- endfor -%}
    </ul>
  </div>
</footer>
