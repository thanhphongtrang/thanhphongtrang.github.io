<footer class="site-foot">
  <div class="wrap">
    <ul class="foot-links">
      {%- for l in site.data.links -%}
        {%- if l.url -%}
          <li><a href="{{ l.url }}"{% unless l.url contains "mailto" %} rel="me"{% endunless %}>{{ l.label }}</a></li>
        {%- endif -%}
      {%- endfor -%}
    </ul>
    <p class="colophon">
      {{ site.author.location }} · Built with Jekyll, no trackers.
      <a href="https://github.com/{{ site.repository }}">Source</a>.
    </p>
  </div>
</footer>
