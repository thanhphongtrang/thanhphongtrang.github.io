---
layout: default
---
<article class="wrap prose">
  {%- unless page.hide_title -%}
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    {%- if page.standfirst %}<p class="standfirst">{{ page.standfirst }}</p>{% endif -%}
  </header>
  {%- endunless -%}
  {%- if page.section %}{% include subtabs.html %}{% endif -%}
  {{ content }}
</article>
