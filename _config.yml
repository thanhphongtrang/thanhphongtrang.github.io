# --- Site ---------------------------------------------------------------
title: "Phong Trang"
tagline: "Doctoral researcher · AI in teacher education"
description: >-
  Phong Trang researches how teachers keep professional judgment when AI joins
  the work, and builds the tools to study it. Doctoral researcher at the
  University of Gothenburg (IPKL), in GRAITE, Sweden's national graduate school
  for AI in Teacher Education.
url: "https://thanhphongtrang.github.io"
baseurl: ""
repository: "thanhphongtrang/thanhphongtrang.github.io"
lang: en

# --- Author -------------------------------------------------------------
# `name` is the canonical publishing name. Cites as: Trang, P.
author:
  name: "Phong Trang"
  cite_as: "Trang, P."
  email: "thanhphong.trang@gmail.com"
  location: "Gothenburg, Sweden"
  affiliation: "University of Gothenburg (IPKL)"
  photo: "/images/headshot.jpg"
  photo_alt: >-
    Portrait of Phong Trang.

# --- Build --------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
permalink: /:title/
timezone: Europe/Stockholm

plugins:
  - jekyll-feed
  - jekyll-sitemap

collections:
  portfolio:
    output: true
    permalink: /portfolio/:name/

# Order matters: where several defaults match, the LAST one wins. Generic first,
# specific last, or every portfolio page silently renders with the wrong layout.
defaults:
  - scope:
      path: ""
    values:
      layout: "page"
  - scope:
      path: ""
      type: "portfolio"
    values:
      layout: "portfolio"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
  - .jekyll-cache
  - node_modules
